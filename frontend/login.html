<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SafeRoute Karachi</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand-header">
      <div class="logo-icon">🛡</div>
      <h1>Safe<span>Route</span> Karachi</h1>
      <p>Sign in to your community account</p>
    </div>

    <div id="alertBox"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Your password" required autocomplete="current-password">
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary w-100 btn-lg" style="margin-top:0.5rem">Sign In</button>
    </form>

    <p class="text-center mt-2" style="font-size:0.88rem;color:var(--gray-300)">
      Don't have an account? <a href="/register.html">Create one</a>
    </p>
    <p class="text-center mt-1" style="font-size:0.8rem;color:var(--gray-500)">
      <a href="/index.html">← Back to Home</a>
    </p>

    <div style="margin-top:1.5rem;padding:1rem;background:var(--navy);border-radius:var(--radius);font-size:0.78rem;color:var(--gray-300)">
      <strong style="color:var(--teal)">Demo credentials:</strong><br>
      Admin: admin@saferoute.pk / password<br>
      User: demo@saferoute.pk / password
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    Auth.redirectIfLoggedIn();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert('alertBox');

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('loginBtn');

      if (!email || !password) {
        return showAlert('alertBox', 'Please enter your email and password.');
      }

      setLoading(btn, true);
      try {
        const { status, ok, data } = await apiRequest('POST', '/auth/login', { email, password });
        if (ok && data.success) {
          Auth.save(data.token, data.user);
          showAlert('alertBox', 'Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = data.user.role === 'admin' ? '/admin.html' : '/dashboard.html';
          }, 800);
        } else {
          showAlert('alertBox', data.message || 'Login failed. Please try again.');
        }
      } catch {
        showAlert('alertBox', 'Network error. Please check your connection.');
      } finally {
        setLoading(btn, false, 'Sign In');
      }
    });
  </script>
</body>
</html>
