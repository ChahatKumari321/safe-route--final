<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — SafeRoute Karachi</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand-header">
      <div class="logo-icon">🛡</div>
      <h1>Safe<span>Route</span> Karachi</h1>
      <p>Create your community account</p>
    </div>

    <div id="alertBox"></div>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" class="form-control" placeholder="Your full name" required autocomplete="name">
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="At least 8 characters" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat your password" required autocomplete="new-password">
      </div>

      <div style="font-size:0.78rem;color:var(--gray-300);margin-bottom:1rem;padding:0.75rem;background:var(--navy);border-radius:var(--radius)">
        By registering, you agree to submit only accurate, good-faith reports. Do not share personal information of victims or alleged offenders.
      </div>

      <button type="submit" id="registerBtn" class="btn btn-primary w-100 btn-lg">Create Account</button>
    </form>

    <p class="text-center mt-2" style="font-size:0.88rem;color:var(--gray-300)">
      Already have an account? <a href="/login.html">Sign in</a>
    </p>
    <p class="text-center mt-1" style="font-size:0.8rem;color:var(--gray-500)">
      <a href="/index.html">← Back to Home</a>
    </p>
  </div>

  <script src="/js/main.js"></script>
  <script>
    Auth.redirectIfLoggedIn();

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert('alertBox');

      const name            = document.getElementById('name').value.trim();
      const email           = document.getElementById('email').value.trim();
      const password        = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn             = document.getElementById('registerBtn');

      if (!name || !email || !password || !confirmPassword) {
        return showAlert('alertBox', 'All fields are required.');
      }
      if (name.length < 2) {
        return showAlert('alertBox', 'Name must be at least 2 characters.');
      }
      if (password.length < 8) {
        return showAlert('alertBox', 'Password must be at least 8 characters.');
      }
      if (password !== confirmPassword) {
        return showAlert('alertBox', 'Passwords do not match.');
      }

      setLoading(btn, true);
      try {
        const { ok, data } = await apiRequest('POST', '/auth/register', { name, email, password });
        if (ok && data.success) {
          Auth.save(data.token, data.user);
          showAlert('alertBox', 'Account created! Redirecting...', 'success');
          setTimeout(() => { window.location.href = '/dashboard.html'; }, 1000);
        } else {
          showAlert('alertBox', data.message || 'Registration failed. Please try again.');
        }
      } catch {
        showAlert('alertBox', 'Network error. Please check your connection.');
      } finally {
        setLoading(btn, false, 'Create Account');
      }
    });
  </script>
</body>
</html>
